<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Marcprotech</title>
  <meta name="description" content="Date coding machines (CIJ, TIJ and laser), spares and consumables from Marcprotech.">
  <meta name="theme-color" content="#00153f">
  <link rel="icon" href="assets/images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
</head>
<body data-page="products">

  <div id="header-placeholder"></div>

  <main>

    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Products</span>
        <h1>Coding equipment and consumables</h1>
        <p>Date coding machines, plus the spares and consumables that keep them printing.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <div class="filter-bar" id="productFilters" role="group" aria-label="Filter products">
          <!-- buttons are created by js/products.js -->
        </div>

        <div class="product-grid" id="productGrid">
          <!-- cards are created by js/products.js -->
        </div>

      </div>
    </section>

    <section class="cta">
      <div class="container">
        <div><h2>Not sure which one you need?</h2><p>Tell us what you print on and your line speed, and we'll recommend the right machine.</p></div>
        <a href="contact.html?topic=quote" class="btn" data-open-quote>Get a Quote</a>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
